<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="My Awesome App description" />
    <link rel="icon" href="/favicon_io/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon_io/apple-touch-icon.png" sizes="180x180" />
    <link rel="mask-icon" href="/favicon_io/mask-icon.svg" color="#F8359B" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7fb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=Outfit:wght@300..800&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expenses V2</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Aplica el tema antes del primer paint para evitar el flash (FOUC).
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = stored === "dark" || (stored !== "light" && prefersDark);
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
        } catch (error) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
